name: Deploy to Server

on:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies & Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Prepare SSH Key (diagnostic)
        run: |
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > $RUNNER_TEMP/diag_key
          chmod 600 $RUNNER_TEMP/diag_key

      - name: Test SSH Connectivity
        run: |
          ssh -p 22 -i $RUNNER_TEMP/diag_key -o StrictHostKeyChecking=no -o BatchMode=yes root@8.133.21.62 "echo connected"

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v4.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 8.133.21.62
          REMOTE_USER: root
          REMOTE_PORT: 22
          SOURCE: dist/
          TARGET: /root/www/vue-admin/dist
          ARGS: '-avzr --delete'
          EXCLUDE: '.git,.github'
          SSH_CMD_ARGS: '-o StrictHostKeyChecking=no'
