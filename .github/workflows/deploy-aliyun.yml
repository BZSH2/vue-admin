name: Build and Deploy Vue Admin to Aliyun ACR

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Deployment environment (dev, test, staging, prod)'

concurrency:
  group: vue-admin-deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    env:
      IMAGE_REPO: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}
      # 镜像标签增加环境后缀
      IMAGE_LATEST: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}:vue-${{ inputs.environment }}-latest
      IMAGE_SHA: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPO }}:vue-${{ inputs.environment }}-${{ github.sha }}
      # 不同环境部署到不同目录
      # DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || format('/opt/vue-admin-{0}', inputs.environment) }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || format('/opt/vue-admin', inputs.environment) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full lint and type check
        run: pnpm lint:ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 传入构建参数
          build-args: |
            BUILD_ENV=${{ inputs.environment }}
          tags: |
            ${{ env.IMAGE_LATEST }}
            ${{ env.IMAGE_SHA }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' '${{ secrets.DEPLOY_SSH_KEY }}' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_HOST }}' >> ~/.ssh/known_hosts

      - name: Prepare remote directory
        run: |
          ssh -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' 'mkdir -p ${{ env.DEPLOY_PATH }}'

      - name: Upload deploy files
        run: |
          scp -P '${{ secrets.DEPLOY_PORT }}' docker-compose.prod.yml deploy/deploy.sh '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/'

      - name: Prepare remote deploy env
        run: |
          cat > .deploy.remote.env <<EOF
          ACR_REGISTRY=${{ secrets.ALIYUN_REGISTRY }}
          ACR_USERNAME=${{ secrets.ALIYUN_USERNAME }}
          ACR_PASSWORD=${{ secrets.ALIYUN_PASSWORD }}
          DEPLOY_IMAGE=${{ env.IMAGE_SHA }}
          DEPLOY_PATH=${{ env.DEPLOY_PATH }}
          EOF
          scp -P '${{ secrets.DEPLOY_PORT }}' .deploy.remote.env '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/.deploy.remote.env'
          rm -f .deploy.remote.env

      - name: Deploy on server
        run: |
          ssh -p '${{ secrets.DEPLOY_PORT }}' '${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}' "
            set -e
            chmod +x '${{ env.DEPLOY_PATH }}/deploy.sh'
            set -a
            . '${{ env.DEPLOY_PATH }}/.deploy.remote.env'
            set +a
            bash '${{ env.DEPLOY_PATH }}/deploy.sh'
            rm -f '${{ env.DEPLOY_PATH }}/.deploy.remote.env'
          "

      - name: Deployment complete
        run: echo "✅ Vue Admin image built, pushed, and deployed successfully."
