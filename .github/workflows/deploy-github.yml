name: Deploy CI/CD

on:
  workflow_call:

# 并发控制：取消正在进行的旧构建，只运行最新的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 权限配置：只赋予必要的权限
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest # 使用 Ubuntu 最新版本运行工作流
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交记录，有利于 changelog 或 git 相关的操作

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 会自动读取 package.json 中的 packageManager

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm' # 启用 pnpm 缓存，加速依赖安装

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 严格依据 lock 文件安装

      - name: Run full lint and type check
        run: pnpm lint:ci

      - name: Build project
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    env:
      VITE_BASE_URL: '/${{ github.event.repository.name }}/'
      VITE_BUILD_COMPRESS: 'gzip,brotli'
      VITE_PRELOAD_ASSETS: '/favicon.svg'
      VITE_PRECONNECT_ORIGINS: 'https://m1.apifoxmock.com'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交记录，有利于 changelog 或 git 相关的操作

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 会自动读取 package.json 中的 packageManager

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm' # 启用 pnpm 缓存，加速依赖安装

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 严格依据 lock 文件安装

      - name: Run full lint and type check
        run: pnpm lint:ci

      - name: Build project
        run: pnpm build:pages

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          force_orphan: true
          keep_files: false
          publish_branch: gh-pages
          publish_dir: dist
          github_token: ${{ secrets.VUE_ADMIN }}
