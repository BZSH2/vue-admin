name: Deploy CI/CD

on:
  push:
    branches:
      - master
      - develop
      - test
      - uat
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 开发环境部署 (develop 分支)
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    name: Deploy to Dev
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: dev
    secrets: inherit

  # 测试环境部署 (test 分支)
  deploy-test:
    if: github.ref == 'refs/heads/test'
    name: Deploy to Test
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: test
    secrets: inherit

  # UAT 环境部署 (uat 分支)
  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    name: Deploy to UAT
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: uat
    secrets: inherit

  # 生产环境部署 (master 分支)
  deploy-prod:
    if: github.ref == 'refs/heads/master'
    name: Deploy to Prod
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: prod
    secrets: inherit

  # GitHub Pages 部署 (仅 master)
  deploy-github-pages:
    if: github.ref == 'refs/heads/master'
    name: Deploy to GitHub Pages
    uses: ./.github/workflows/deploy-github.yml
    secrets: inherit
