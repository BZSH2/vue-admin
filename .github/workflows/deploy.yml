name: Deploy CI/CD

on:
  push:
    branches:
      - master
      - develop
      - 'feature/*'
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 开发环境部署 (develop 分支)
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    name: Deploy to Dev
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: dev
    secrets: inherit

  # 测试环境部署 (feature/* 分支)
  deploy-test:
    if: startsWith(github.ref, 'refs/heads/feature/')
    name: Deploy to Test
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: test
    secrets: inherit

  # 预发布环境部署 (release/* 分支)
  deploy-staging:
    if: startsWith(github.ref, 'refs/heads/release/')
    name: Deploy to Staging
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: staging
    secrets: inherit

  # 生产环境部署 (master 分支)
  deploy-prod:
    if: github.ref == 'refs/heads/master'
    name: Deploy to Prod
    uses: ./.github/workflows/deploy-aliyun.yml
    with:
      environment: prod
    secrets: inherit

  # GitHub Pages 部署 (仅 master)
  deploy-github-pages:
    if: github.ref == 'refs/heads/master'
    name: Deploy to GitHub Pages
    uses: ./.github/workflows/deploy-github.yml
    secrets: inherit
